name: Build latest static Git

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest Git release
        id: git-version
        run: |
          version=$(git ls-remote --tags --refs https://github.com/git/git.git 'refs/tags/v[0-9]*' \
            | sed 's#.*refs/tags/v##' \
            | grep -E '^[0-9]+(\.[0-9]+)+$' \
            | sort -V \
            | tail -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pull Alpine image
        run: docker pull alpine:latest

      - name: Build in a new Alpine container
        env:
          GIT_VERSION: ${{ steps.git-version.outputs.version }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -e GIT_VERSION="$GIT_VERSION" \
            alpine:latest sh -euxc '
              apk add --no-cache build-base linux-headers cargo perl autoconf pkgconf \
                ca-certificates openssl-dev openssl-libs-static \
                zlib-dev zlib-static \
                expat-dev expat-static wget
              update-ca-certificates

              cd /tmp
              wget -q https://curl.se/download/curl-8.15.0.tar.gz
              tar -xzf curl-8.15.0.tar.gz
              cd curl-8.15.0
              ./configure \
                --prefix=/opt/curl-static \
                --disable-shared --enable-static \
                --with-openssl --with-zlib \
                --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt \
                --without-libpsl --without-libidn2 \
                --without-brotli --without-zstd \
                --without-nghttp2 --without-nghttp3 --without-ngtcp2 \
                --without-libssh2 --disable-ldap --disable-rtsp \
                --disable-dict --disable-telnet --disable-tftp \
                --disable-pop3 --disable-imap --disable-smb \
                --disable-gopher --disable-mqtt --disable-manual
              make -j"$(getconf _NPROCESSORS_ONLN || echo 2)"
              make install

              cd /work
              wget -q "https://www.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.gz"
              tar -xzf "git-${GIT_VERSION}.tar.gz"
              cd "git-${GIT_VERSION}"
              curl_cflags="$(/opt/curl-static/bin/curl-config --cflags)"
              curl_libs="$(/opt/curl-static/bin/curl-config --static-libs)"
              make -j"$(getconf _NPROCESSORS_ONLN || echo 2)" \
                NO_REGEX=NeedsStartEnd CURL_CONFIG=/opt/curl-static/bin/curl-config \
                CURL_CFLAGS="$curl_cflags" CURL_LIBCURL="$curl_libs" \
                NO_TCLTK=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease \
                NO_GETTEXT=YesPlease NO_INSTALL_HARDLINKS=YesPlease \
                NO_R_TO_GIT=YesPlease LDFLAGS="-static -no-pie" \
                prefix=/opt/git-static all
              rm -rf /opt/git-static
              make \
                NO_REGEX=NeedsStartEnd CURL_CONFIG=/opt/curl-static/bin/curl-config \
                CURL_CFLAGS="$curl_cflags" CURL_LIBCURL="$curl_libs" \
                NO_TCLTK=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease \
                NO_GETTEXT=YesPlease NO_INSTALL_HARDLINKS=YesPlease \
                NO_R_TO_GIT=YesPlease LDFLAGS="-static -no-pie" \
                prefix=/opt/git-static install
              test -x /opt/git-static/bin/git
              test -x /opt/git-static/libexec/git-core/git-remote-http
              test -x /opt/git-static/libexec/git-core/git-remote-https
              file /opt/git-static/bin/git \
                /opt/git-static/libexec/git-core/git-remote-http \
                /opt/git-static/libexec/git-core/git-remote-https
              ldd /opt/git-static/bin/git 2>&1 | tee /tmp/ldd-git.txt || true
              ldd /opt/git-static/libexec/git-core/git-remote-http 2>&1 | tee /tmp/ldd-http.txt || true
              ldd /opt/git-static/libexec/git-core/git-remote-https 2>&1 | tee /tmp/ldd-https.txt || true
              ! grep -qE "=>|not found" /tmp/ldd-git.txt /tmp/ldd-http.txt /tmp/ldd-https.txt
              /opt/git-static/bin/git --version
              GIT_EXEC_PATH=/opt/git-static/libexec/git-core \
                /opt/git-static/bin/git -c http.sslVerify=true \
                help -a >/dev/null
              cp /opt/git-static/bin/git \
                "/work/git-${GIT_VERSION}-alpine-static"
              cp /opt/git-static/libexec/git-core/git-remote-https \
                "/work/git-remote-https-${GIT_VERSION}-alpine-static"
              cp /opt/git-static/libexec/git-core/git-remote-http \
                "/work/git-remote-http-${GIT_VERSION}-alpine-static"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: git-${{ steps.git-version.outputs.version }}-alpine-static
          path: |
            git-${{ steps.git-version.outputs.version }}-alpine-static
            git-remote-http-${{ steps.git-version.outputs.version }}-alpine-static
            git-remote-https-${{ steps.git-version.outputs.version }}-alpine-static
          if-no-files-found: error
